<main class="page-main">
  <article class="doc">
    <h1>문의하기</h1>
    <p class="updated">게임 제안 · 버그 제보 · 이용 문의</p>

    <p class="lead">사이트를 이용하면서 불편했던 점, 새로 넣었으면 하는 게임, 버그 제보 등 무엇이든 아래 폼으로 남겨 주세요. 답장이 필요하면 이메일 주소를 함께 적어 주세요.</p>

    <!-- Formspree 설정 안내:
         1) https://formspree.io 가입 (무료)
         2) New Form 만들고 알림 받을 이메일 지정
         3) 발급된 폼 주소(https://formspree.io/f/XXXXXXXX)를 아래 action 의 YOUR_FORM_ID 자리에 교체
         설정 전에는 제출이 동작하지 않습니다. -->
    <form class="cform" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="_subject" value="딴짓 스프레드시트 문의">

      <label for="cname">이름 <span style="color:var(--muted);font-weight:400">(선택)</span></label>
      <input id="cname" name="name" type="text" autocomplete="name">

      <label for="cemail">이메일 <span style="color:var(--muted);font-weight:400">(답장 받을 주소)</span></label>
      <input id="cemail" name="email" type="email" autocomplete="email" required>

      <label for="cmsg">문의 내용</label>
      <textarea id="cmsg" name="message" required placeholder="자유롭게 적어 주세요…"></textarea>

      <button class="btn" type="submit">보내기</button>
    </form>

    <p style="margin-top:18px;font-size:12.5px;color:var(--muted)">보내 주신 내용은 문의 처리 목적으로만 사용하며, 자세한 내용은 <a href="privacy.html">개인정보 처리방침</a>을 참고해 주세요.</p>
  </article>
